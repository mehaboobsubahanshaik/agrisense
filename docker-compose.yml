name: agrisense-ai

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agri}:${POSTGRES_PASSWORD:-agri}@postgres:5432/${POSTGRES_DB:-agrisense}
  REDIS_URL: redis://redis:6379/0
  CHROMA_URL: http://chromadb:8000
  AI_SERVICE_URL: http://ai-service:9000
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  DEV_MODE: ${DEV_MODE:-true}
  ENV: ${ENV:-development}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}
  SCHEME_REFRESH_ENABLED: ${SCHEME_REFRESH_ENABLED:-true}
  WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
  WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
  OPENWEATHER_KEY: ${OPENWEATHER_KEY:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
  TWILIO_SID: ${TWILIO_SID:-}
  TWILIO_TOKEN: ${TWILIO_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri}
      POSTGRES_DB: ${POSTGRES_DB:-agrisense}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agri} -d ${POSTGRES_DB:-agrisense}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [agrinet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [agrinet]

  chromadb:
    image: chromadb/chroma:0.6.3
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/chroma/chroma
    networks: [agrinet]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      YOLO_MODEL_PATH: /models/crop_disease_yolo11.pt
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
    volumes:
      - ./models:/models:ro
    networks: [agrinet]

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [agrinet]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-B", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [agrinet]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [agrinet]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params_agrisense:/etc/nginx/proxy_params_agrisense:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend, ai-service]
    networks: [agrinet]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    networks: [agrinet]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [agrinet]

volumes:
  pgdata: {}
  redisdata: {}
  chromadata: {}
  promdata: {}
  grafanadata: {}
  uploads: {}

networks:
  agrinet:
    driver: bridge
