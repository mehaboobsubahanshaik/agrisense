name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agri, POSTGRES_PASSWORD: agri, POSTGRES_DB: agrisense_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agri" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff aiosqlite
      - name: Lint
        run: ruff check backend/app ai-service/app
      - name: Format check
        run: ruff format --check backend/app || true
      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://agri:agri@localhost:5432/agrisense_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
          DEV_MODE: 'true'
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build backend frontend
      - name: Security scan (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
