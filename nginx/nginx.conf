user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 20m;
  server_tokens off;

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';
  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Helmet-equivalent headers, set once at the edge
  add_header X-Frame-Options            "SAMEORIGIN"        always;
  add_header X-Content-Type-Options     "nosniff"           always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy         "geolocation=(self), microphone=(self), camera=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin"       always;

  # Rate limit zones - a second layer behind the application limiter
  limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

  upstream backend_up  { server backend:8000; }
  upstream frontend_up { server frontend:80; }
  upstream ai_up       { server ai-service:9000; }

  server {
    listen 80;
    server_name _;

    # Uncomment after putting fullchain.pem/privkey.pem in nginx/certs to force HTTPS
    # return 301 https://$host$request_uri;

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend_up;
      include /etc/nginx/proxy_params_agrisense;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend_up;
      include /etc/nginx/proxy_params_agrisense;
    }

    location /uploads/ { proxy_pass http://backend_up; include /etc/nginx/proxy_params_agrisense; }
    location /docs     { proxy_pass http://backend_up; include /etc/nginx/proxy_params_agrisense; }
    location /openapi.json { proxy_pass http://backend_up; include /etc/nginx/proxy_params_agrisense; }
    location /health   { proxy_pass http://backend_up; include /etc/nginx/proxy_params_agrisense; }

    location /ai/ {
      proxy_pass http://ai_up/;
      # Timeouts come from the shared include (120s read) - nginx rejects a
      # second proxy_read_timeout in the same context. The backend's own httpx
      # client times out at 90s, so 120s at the edge is already generous.
      include /etc/nginx/proxy_params_agrisense;
    }

    location / {
      proxy_pass http://frontend_up;
      include /etc/nginx/proxy_params_agrisense;
    }
  }

  # HTTPS server - drop certs into nginx/certs and uncomment
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.in;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   location / { proxy_pass http://frontend_up; include /etc/nginx/proxy_params_agrisense; }
  #   location /api/ { proxy_pass http://backend_up; include /etc/nginx/proxy_params_agrisense; }
  # }
}
